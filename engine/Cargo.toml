[package]
name = "isharded-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The native token path for iSharded stages"
publish = false

[lib]
name = "isharded_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
parking_lot = "0.12"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A bug here must end the stage process: the worker restarts it and replays the reply.
panic = "abort"

[dev-dependencies]
serde_json = "1"
