<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>iSharded chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2308738a' d='M6 3h14l-2.4 5H3.6zM8 10h14l-2.4 5H5.6zM4 17h14l-2.4 5H1.6z'/%3E%3C/svg%3E">
  <script>try { const theme = localStorage.getItem('isharded-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch {}</script>
  <style>/* isharded:ui.css */</style>
</head>
<body class="chat-page">
  <a class="skip" href="#prompt">Skip to the message box</a>
  <header class="top">
    <a class="brand" href="/chat"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h14l-2.4 5H3.6zM8 10h14l-2.4 5H5.6zM4 17h14l-2.4 5H1.6z"/></svg><span>iSharded</span></a>
    <nav class="tabs" aria-label="Pages"><a href="/chat" aria-current="page">Chat</a><a href="/dashboard">Dashboard</a></nav>
    <div class="model-control">
      <i class="glyph idle tone-idle" id="light"></i>
      <select class="select" id="modelChoice" aria-label="Which running model answers this chat" hidden></select>
      <button class="model-button" id="modelButton" type="button" aria-haspopup="dialog"><span id="modelLabel">Choose a model</span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg></button>
    </div>
    <div class="top-gap"></div>
    <div class="pill tone-idle" id="pill" role="status" hidden><i class="glyph idle" id="pillGlyph"></i><span id="pillText"></span></div>
    <button class="btn quiet" id="newChat" type="button">New chat</button>
    <button class="icon-btn" id="themeButton" type="button"></button>
    <button class="btn quiet" id="signOut" type="button" hidden>Sign out</button>
  </header>

  <div class="workspace">
    <button class="rail-toggle" id="railToggle" type="button" aria-expanded="false" aria-controls="rail"><span id="railToggleText">Nothing loaded</span><span id="railToggleStrip" style="flex:1;min-width:0"></span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg></button>
    <main class="conversation">
      <div class="chat-notices notices" id="notices"></div>
      <div class="log" id="log" role="log" tabindex="0" aria-label="Conversation"><div class="column" id="turns"></div></div>
      <form class="composer" id="composer">
        <div class="column box">
          <div class="attachments" id="attachments" hidden></div>
          <p class="attach-note" id="attachNote" role="status" hidden></p>
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" rows="1" placeholder="Message the model"></textarea>
          <div class="controls">
            <button class="btn quiet small" id="attach" type="button" title="Attach an image for the model to look at" hidden>Add image</button>
            <input class="sr-only" id="imageFile" type="file" accept="image/png,image/jpeg,image/gif,image/bmp" multiple tabindex="-1" aria-hidden="true" hidden>
            <label class="switch" title="Lets the model reason before it answers, on models that support it"><input type="checkbox" id="thinking"><i></i>Thinking</label>
            <label>Temperature <input class="num-input" type="number" id="temperature" min="0" max="2" step="0.1" value="0.7"></label>
            <label>Max tokens <input class="num-input" type="number" id="maxTokens" min="1" max="32768" step="1" value="1024"></label>
            <button class="btn primary send" id="send" type="submit">Send</button>
          </div>
        </div>
      </form>
    </main>
    <aside class="rail" id="rail" tabindex="0" aria-label="Where the model is running"></aside>
  </div>

  <dialog class="sheet" id="picker" aria-labelledby="pickerTitle">
    <form class="sheet-body" id="pickerForm" method="dialog">
      <h2 id="pickerTitle">Load a model</h2>
      <label class="search" style="max-width:none"><span class="sr-only">Search models</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input class="input" id="catalogSearch" type="search" placeholder="Search the model list" autocomplete="off" spellcheck="false"></label>
      <div class="scroll-list" id="catalog"></div>
      <label class="field">Or any Hugging Face model, or a folder on this node
        <input class="input" id="customModel" placeholder="Qwen/Qwen3-4B" autocomplete="off" spellcheck="false">
      </label>
      <div class="fields">
        <label class="field">Context length
          <input class="input" id="contextTokens" type="number" min="128" step="128" value="4096">
        </label>
        <label class="field">Placement
          <select class="select" id="placement">
            <option value="auto">Fastest route</option>
            <option value="spread">Use every worker, however far</option>
            <option value="compact">Use as few workers as fit</option>
          </select>
        </label>
      </div>
      <div class="fields">
        <label class="field">Entry node, which sees your prompt
          <select class="select" id="entryWorker"></select>
        </label>
        <label class="field">Exit node, which sees the reply
          <select class="select" id="exitWorker"></select>
        </label>
      </div>
      <div class="preview" id="preview" aria-live="polite">Choose a model to see where it would run.</div>
      <div class="sheet-actions">
        <button class="btn" type="button" id="closePicker">Close</button>
        <button class="btn primary" type="button" id="loadModel" disabled>Load model</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet narrow" id="auth" aria-labelledby="authTitle">
    <form class="sheet-body" id="authForm">
      <h2 id="authTitle">Sign in</h2>
      <p>This mesh is protected. Your key stays in this browser.</p>
      <label class="field">Key
        <input class="input" id="tokenInput" type="password" autocomplete="current-password">
      </label>
      <p class="error" id="authError" role="alert" hidden></p>
      <div class="sheet-actions"><button class="btn primary" type="submit">Sign in</button></div>
    </form>
  </dialog>

  <dialog class="sheet narrow" id="move" aria-labelledby="moveTitle">
    <form class="sheet-body" method="dialog">
      <h2 id="moveTitle">Move this reply to another node?</h2>
      <p id="moveText"></p>
      <div class="sheet-actions">
        <button class="btn" value="no">Stop the reply</button>
        <button class="btn primary" value="yes">Send and continue</button>
      </div>
    </form>
  </dialog>

  <script>
    const $ = id => document.getElementById(id);
    const store = {
      get: key => { try { return localStorage.getItem(key); } catch { return null; } },
      set: (key, value) => { try { localStorage.setItem(key, value); } catch {} },
      drop: key => { try { localStorage.removeItem(key); } catch {} },
    };
    // What one request can carry. A conversation resends its images on every turn.
    const MOST_IMAGE_BYTES = 10 * 1024 * 1024;
    const state = { attachments: [], approved: new Set(), token: store.get('isharded-token') || '', status: null, turns: [], streaming: false, abort: null, link: null, selected: '', previewTimer: null, previewId: 0, lastPulse: 0, failures: 0, signedOut: false, members: {}, catalog: null, catalogFailed: false };
    const TIER = { vram: 'VRAM', unified: 'Unified', ram: 'RAM', disk: 'Disk' };
    const TIER_ORDER = ['vram', 'unified', 'ram', 'disk'];
    const PHASE = { resolving: 'Reading the model\'s tensor list', fetching: 'Downloading each worker\'s shards', loading: 'Moving weights into memory' };
    const ICONS = {
      system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>',
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',
      dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>',
    };
    // GGUF ids carry a repository and a file; the file names the model and its quantization.
    const modelName = id => { const text = String(id || ''); if (/\.gguf$/i.test(text)) return text.split(/[:\\/]/).pop().replace(/\.gguf$/i, ''); if (/^([A-Za-z]:[\\/]|[\\/.~])/.test(text)) return text.split(/[\\/]/).filter(Boolean).pop() || text; return text; };
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    const size = value => { if (!value) return '0 B'; const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB']; const i = Math.min(Math.floor(Math.log(value) / Math.log(1024)), 4); return `${(value / 1024 ** i).toFixed(i > 2 ? 2 : 1).replace(/\.0+$/, '')} ${units[i]}`; };
    const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
    const headers = () => state.token ? { Authorization: `Bearer ${state.token}` } : {};
    const stageLayers = stage => { const start = Number(stage.start_layer), end = Number(stage.end_layer); return end - 1 > start ? `layers ${start}–${end - 1}` : `layer ${start}`; };
    const byName = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });

    // Repainting a region must not cost the reader their place in it.
    const painted = new WeakMap();
    function paint(element, html) {
      if (painted.get(element) === html) return;
      const focused = element.contains(document.activeElement) ? document.activeElement.dataset.key : null;
      const top = element.scrollTop;
      element.innerHTML = html;
      painted.set(element, html);
      element.scrollTop = top;
      if (focused) element.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
    }

    function takeKeyFromLink() {
      const match = location.hash.match(/^#(?:.*&)?key=([^&]*)/);
      if (!match) return false;
      let key = match[1];
      try { key = decodeURIComponent(key); } catch {}
      if (key) { state.token = key; store.set('isharded-token', key); }
      const rest = location.hash.slice(1).split('&').filter(part => !part.startsWith('key=')).join('&');
      history.replaceState(null, '', location.pathname + location.search + (rest ? `#${rest}` : ''));
      return Boolean(key);
    }

    async function api(path, options = {}) {
      const { timeout, ...rest } = options;
      const control = new AbortController();
      const timer = timeout ? setTimeout(() => control.abort(), timeout) : null;
      let response;
      try {
        response = await fetch(path, { ...rest, signal: control.signal, headers: { 'Content-Type': 'application/json', ...headers(), ...(rest.headers || {}) } });
      } catch {
        throw Object.assign(new Error('This node did not answer.'), { offline: true });
      } finally { clearTimeout(timer); }
      if (response.status === 401) { state.signedOut = true; askForKey(Boolean(state.token)); throw Object.assign(new Error('A key is needed.'), { status: 401 }); }
      if (!response.ok) {
        let message = `Request failed with HTTP ${response.status}`;
        try { const body = await response.json(); message = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail); } catch {}
        const error = new Error(message); error.status = response.status; throw error;
      }
      return response.json();
    }

    function inlineMarkdown(text) {
      return text.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    }
    function renderProse(text) {
      const blocks = [];
      let list = null;
      const flush = () => { if (list) { blocks.push(`<${list.tag}>${list.items.map(item => `<li>${item}</li>`).join('')}</${list.tag}>`); list = null; } };
      let paragraph = [];
      const endParagraph = () => { if (paragraph.length) { blocks.push(`<p>${paragraph.join('<br>')}</p>`); paragraph = []; } };
      for (const line of text.split('\n')) {
        const bullet = line.match(/^\s*[-*]\s+(.*)$/), numbered = line.match(/^\s*\d+\.\s+(.*)$/);
        if (bullet || numbered) {
          endParagraph();
          const tag = bullet ? 'ul' : 'ol';
          if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
          list.items.push(inlineMarkdown(esc((bullet || numbered)[1])));
        } else if (!line.trim()) { flush(); endParagraph(); }
        else { flush(); paragraph.push(inlineMarkdown(esc(line))); }
      }
      flush(); endParagraph();
      return blocks.join('');
    }
    function renderMarkdown(text) {
      return text.split(/(```[\s\S]*?(?:```|$))/g).map(part => {
        if (!part.startsWith('```')) return renderProse(part);
        const body = part.replace(/^```[^\n]*\n?/, '').replace(/```$/, '');
        return `<pre><code>${esc(body)}</code></pre>`;
      }).join('');
    }
    function splitReasoning(text) {
      const end = text.indexOf('</think>');
      if (end >= 0) return { reasoning: text.slice(0, end).replace('<think>', '').trim(), answer: text.slice(end + 8).trimStart(), thinking: false };
      if (text.trimStart().startsWith('<think>')) return { reasoning: text.replace('<think>', '').trim(), answer: '', thinking: true };
      return { reasoning: '', answer: text, thinking: false };
    }
    function renderAnswer(turn) {
      const { reasoning, answer, thinking } = splitReasoning(turn.text);
      let html = '';
      if (reasoning) html += `<details class="reasoning"${thinking ? ' open' : ''}><summary>${thinking ? 'Thinking' : 'Show reasoning'}</summary><div>${esc(reasoning)}</div></details>`;
      html += answer ? `<div class="answer">${renderMarkdown(answer)}</div>` : (turn.pending && !reasoning ? `<div class="waiting"><i class="glyph work"></i>${esc(turn.waiting || 'Running the prompt through the route')}</div>` : '');
      if (turn.notice) html += `<div class="receipt">${esc(turn.notice)}</div>`;
      if (turn.error) html += `<div class="failure" role="alert">${esc(turn.error)}</div>`;
      if (turn.receipt) html += `<div class="receipt">${esc(turn.receipt)}</div>`;
      return html;
    }
    const jobRunning = status => { const job = status?.load_job; return Boolean(job) && !['ready', 'failed', 'cancelled'].includes(job.phase); };
    const workerCount = route => count(route.length, 'worker');
    const liveWorkers = status => Object.values(status?.workers || {}).filter(w => w.live && (w.hardware?.memory_pools || []).length).length;
    function memoryOf(status) {
      const byKind = status?.virtual_hardware?.memory_by_kind || {};
      return { byKind, budget: Object.values(byKind).reduce((n, kind) => n + (kind.budget_bytes || 0), 0) || status?.virtual_hardware?.ram_total_bytes || 0 };
    }
    const sizeBytes = text => { const match = /([\d.]+)\s*(MB|GB|TB)/i.exec(text || ''); return match ? Number(match[1]) * { MB: 1e6, GB: 1e9, TB: 1e12 }[match[2].toUpperCase()] : 0; };
    function modelRows(models, budget) {
      return models.map(model => { const big = budget && sizeBytes(model.size) > budget; return `<li><button class="model-row${big ? ' too-big' : ''}" type="button" data-model="${esc(model.id)}" data-key="m:${esc(model.id)}" aria-pressed="${model.id === state.selected}"><span class="id">${esc(modelName(model.id))}</span><span class="meta">${esc(big ? 'Larger than this mesh' : model.kind)}</span><span class="meta">${esc(model.size)}</span></button></li>`; }).join('');
    }
    function firstRun(status) {
      const { byKind, budget } = memoryOf(status), workers = liveWorkers(status);
      const kinds = TIER_ORDER.filter(kind => byKind[kind]?.budget_bytes);
      const capacity = kinds.length ? `<div class="ribbon" aria-hidden="true">${kinds.map(kind => `<div class="seg" style="--layers:${byKind[kind].budget_bytes}"><span class="cell"><i class="tier-${kind}"></i></span></div>`).join('')}</div><div class="legend">${kinds.map(kind => `<span class="tier-${kind}"><i></i>${TIER[kind]} <b>${size(byKind[kind].budget_bytes)}</b></span>`).join('')}</div>` : '';
      const fit = (state.catalog || []).filter(model => !budget || sizeBytes(model.size) <= budget).sort((a, b) => sizeBytes(b.size) - sizeBytes(a.size)).slice(0, 5);
      const list = state.catalogFailed ? '<p class="list-note">The model list could not be read. You can still load a model by name.</p>' : state.catalog ? (fit.length ? `<ul class="model-list">${modelRows(fit, budget)}</ul>` : '<p class="list-note">No listed model fits this memory. You can load a smaller one by name.</p>') : '<p class="list-note">Reading the model list</p>';
      return `<div class="greeting"><h1>Load a model to start</h1><p>${workers} worker${workers === 1 ? ' is' : 's are'} connected, with ${size(budget)} for weights. Each one downloads only the layers it will run.</p>${capacity}<div class="scroll-list">${list}</div><div class="greeting-actions"><button class="btn primary" type="button" id="emptyPick">See every model</button></div></div>`;
    }
    function renderEmpty() {
      const status = state.status;
      if (state.signedOut) return '<div class="greeting"><h1>Signed out</h1><p>Sign in with a key to chat with this mesh.</p><div class="greeting-actions"><button class="btn primary" type="button" id="emptySignIn">Sign in</button></div></div>';
      if (!status) return state.failures ? '<div class="greeting"><h1>This node is not answering</h1><p>The page keeps trying. Any other node in the mesh can serve this chat.</p></div>' : '<div class="greeting"><h1>Connecting to this node</h1></div>';
      const ready = status.status === 'ready';
      if (ready && jobRunning(status)) {
        const job = status.load_job, serving = status.route || [];
        const change = job.model === status.model ? `A new layout across ${workerCount(job.route || [])} is being prepared` : `${modelName(job.model)} is being prepared`;
        return `<div class="greeting"><h1>${esc(modelName(status.model))} is running on ${workerCount(serving)}</h1><p>${esc(change)}. Chat stays on the current layout, which has all its weights, until every new shard is in place.</p></div>`;
      }
      if (ready) return `<div class="greeting"><h1>${esc(modelName(status.model))} is ready</h1><p>Send a message to run it across the mesh.</p></div>`;
      if (jobRunning(status)) {
        const job = status.load_job;
        const percent = job.bytes_total ? Math.floor(job.bytes_done / job.bytes_total * 100) : 0;
        const bar = job.phase === 'fetching' && job.bytes_total ? `<div class="progress" role="progressbar" aria-label="Load progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><i style="width:${percent}%"></i></div>` : '';
        return `<div class="greeting"><h1>Loading ${esc(modelName(job.model))}</h1>${bar}<p>${esc(PHASE[job.phase] || job.phase)}${job.phase === 'fetching' && job.bytes_total ? `, ${percent}%` : ''}. Chat opens when every shard is in place.</p></div>`;
      }
      if (status.status === 'recovering') return `<div class="greeting"><h1>Recovering ${esc(modelName(status.model) || 'the last model')}</h1><p>Waiting for its workers to come back. Chat opens when the route is whole again.</p></div>`;
      if (status.status === 'repairing') return `<div class="greeting"><h1>Repairing ${esc(modelName(status.model))}</h1><p>A stage lost its layers and is getting them back. Chat opens when the route is whole again.</p></div>`;
      if (status.load_job?.phase === 'failed') return `<div class="greeting"><h1>${esc(modelName(status.load_job.model))} did not load</h1><p class="failure">${esc(status.load_job.error)}</p><div class="greeting-actions"><button class="btn primary" type="button" id="emptyPick">Choose a model</button></div></div>`;
      if (!liveWorkers(status)) return '<div class="greeting"><h1>No workers connected</h1><p>Start a node with <code>python -m isharded node</code> and point it at this node, or create an invite on the dashboard. It will appear here.</p><div class="greeting-actions"><a class="btn" href="/dashboard">Open the dashboard</a></div></div>';
      if (!state.catalog && !state.catalogFailed) readCatalog();
      return firstRun(status);
    }
    function renderTurns() {
      const root = $('turns');
      if (!state.turns.length) {
        paint(root, renderEmpty());
        if ($('emptyPick')) $('emptyPick').onclick = () => openPicker();
        if ($('emptySignIn')) $('emptySignIn').onclick = () => askForKey(false);
        return;
      }
      painted.delete(root);
      root.innerHTML = state.turns.map(turn => turn.role === 'user' ? `<div class="turn user"><div>${(turn.images || []).map(url => `<img class="turn-image" src="${esc(url)}" alt="An attached image">`).join('')}${esc(turn.text)}</div></div>` : `<div class="turn">${renderAnswer(turn)}</div>`).join('');
    }
    // While a reply streams, only its own block changes, so earlier turns keep any selection.
    function renderLastTurn(turn) {
      const root = $('turns');
      if (root.children.length === state.turns.length && !painted.has(root)) root.lastElementChild.innerHTML = renderAnswer(turn);
      else renderTurns();
    }
    function stickToBottom(force) {
      const log = $('log');
      if (force || log.scrollHeight - log.scrollTop - log.clientHeight < 140) log.scrollTop = log.scrollHeight;
    }

    function pulse() {
      const now = performance.now();
      if (now - state.lastPulse < 420) return;
      state.lastPulse = now;
      document.querySelectorAll('.pulse').forEach((element, index) => {
        setTimeout(() => { element.classList.remove('run'); void element.offsetWidth; element.classList.add('run'); }, index * 90);
      });
    }

    function askToMove(url) {
      $('moveText').textContent = `This node stopped answering. Send your key and this conversation to ${url} to finish the reply?`;
      $('move').returnValue = '';
      $('move').showModal();
      return new Promise(resolve => { $('move').addEventListener('close', () => resolve($('move').returnValue === 'yes'), { once: true }); });
    }

    const messageContent = turn => turn.images?.length ? [...turn.images.map(url => ({ type: 'image_url', image_url: { url } })), ...(turn.text ? [{ type: 'text', text: turn.text }] : [])] : turn.text;
    async function send(text) {
      const images = state.attachments.map(item => item.url);
      state.attachments = []; renderAttachments();
      const history = state.turns.filter(turn => !turn.error).map(turn => ({ role: turn.role, content: turn.role === 'assistant' ? splitReasoning(turn.text).answer : messageContent(turn) }));
      history.push({ role: 'user', content: messageContent({ text, images }) });
      state.turns.push({ role: 'user', text, images });
      const turn = { role: 'assistant', text: '', pending: true };
      state.turns.push(turn);
      state.streaming = true; state.abort = new AbortController();
      syncComposer(); renderTurns(); stickToBottom(true);
      const started = performance.now();
      const attempt = async base => {
        // Polling this node notices a link that went silent, which a stream alone never reports.
        const link = new AbortController(), stop = () => link.abort();
        state.abort.signal.addEventListener('abort', stop, { once: true });
        state.link = base ? null : link;
        state.lastByte = performance.now();
        try {
          const response = await fetch(base + '/v1/chat/completions', {
            method: 'POST', signal: link.signal,
            headers: { 'Content-Type': 'application/json', ...headers() },
            body: JSON.stringify({ model: $('modelChoice').hidden ? undefined : $('modelChoice').value, messages: history, stream: true, temperature: Number($('temperature').value), top_p: 0.9, top_k: 40, max_tokens: Number($('maxTokens').value), enable_thinking: $('thinking').checked }),
          });
          if (!response.ok) { let message = `The request failed with HTTP ${response.status}.`; try { message = (await response.json()).detail; } catch {} throw new Error(message); }
          const reader = response.body.getReader(), decoder = new TextDecoder();

    function syncComposer() {

    function tierOf(status, workerId, poolId) {

    $('composer').onsubmit = event => {
      event.preventDefault();
      if (state.streaming) { state.abort.abort(); return; }
      const text = $('prompt').value.trim();
      if ((!text && !state.attachments.length) || state.status?.status !== 'ready') return;
      $('prompt').value = ''; $('prompt').style.height = '';
      send(text);
    };
    $('attach').onclick = () => $('imageFile').click();
    $('imageFile').onchange = event => { addImages([...event.target.files]); event.target.value = ''; };
    $('attachments').onclick = event => {
      const button = event.target.closest('button');
      if (button) { state.attachments.splice(Number(button.dataset.index), 1); renderAttachments(); }
    };
    $('prompt').onkeydown = event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('composer').requestSubmit(); } };
    $('prompt').oninput = event => { const box = event.target; box.style.height = 'auto'; box.style.height = `${box.scrollHeight}px`; };
    addEventListener('hashchange', () => { if (takeKeyFromLink()) { state.signedOut = false; if ($('auth').open) $('auth').close(); poll(); } });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

    takeKeyFromLink();
    applyTheme(document.documentElement.dataset.theme || 'system');
    renderTurns(); syncComposer(); poll();
  </script>
</body>
</html>
