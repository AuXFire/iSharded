[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shardmesh"
version = "0.3.0"
description = "Run one language model across a decentralized pool of machines"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "numpy>=1.24",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.8,<3",
  "psutil>=5.9,<7",
  "cryptography>=42",
  "safetensors>=0.4,<1",
  # httpcore imports this on every request. Newer anyio no longer brings it, and
  # a missing module is searched for again on every attempt.
  "sniffio>=1.3,<2",
  "tokenizers>=0.19,<1",
  "torch>=2.2",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
# transformers is only the reference that adapters are tested against.
test = ["pytest>=8", "pytest-asyncio>=0.23", "transformers>=4.42", "cryptography>=42"]
# Kept so older install commands still work: cryptography is now always installed.
# For any node in a pool with an authority, and the machine that issues certificates.
pool = []

[project.scripts]
shardmesh = "shardmesh.cli:main"
shardmesh-orchestrator = "shardmesh.orchestrator:main"
shardmesh-worker = "shardmesh.worker:main"
shardmesh-node = "shardmesh.node:main"

[tool.setuptools.packages.find]
include = ["shardmesh*"]

[tool.setuptools.package-data]
shardmesh = ["dashboard.html", "chat.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

