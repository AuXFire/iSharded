[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isharded"
version = "0.3.0"
description = "Run one language model across a decentralized pool of machines"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "numpy>=1.24",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.8,<3",
  "psutil>=5.9,<7",
  "cryptography>=42",
  "safetensors>=0.4,<1",
  # httpcore imports this on every request. Newer anyio no longer brings it, and
  # a missing module is searched for again on every attempt.
  "sniffio>=1.3,<2",
  "tokenizers>=0.19,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
# Runs safetensors models. A GGUF node never uses it, and it is several GiB.
torch = ["torch>=2.2"]
# transformers is only the reference that adapters are tested against.
test = ["pytest>=8", "pytest-asyncio>=0.23", "transformers>=4.42", "cryptography>=42", "pypdf>=4"]
# Kept so older install commands still work: cryptography is now always installed.

[project.scripts]
isharded = "isharded.cli:main"
isharded-orchestrator = "isharded.orchestrator:main"
isharded-worker = "isharded.worker:main"

[tool.setuptools.packages.find]
include = ["isharded*"]

[tool.setuptools.package-data]
isharded = ["dashboard.html", "chat.html", "ui.css", "ui.js", "flags.svg", "countries.bin", "native/*"]
"isharded.assistant" = ["assistant.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test still running after this long prints every thread's stack, so a hang shows where it waits.
faulthandler_timeout = 600

